window.GIVEAWAY_RULES = {"en":{"title":"GIVEAWAY RULES","giveaway":"GTA VI GIVEAWAY","prize":"Prize: GTA VI for PC (Steam key)","body":"1. Organizer: Sokyra Labs, the developer of Vice Atlas. Google, Rockstar Games and Take-Two Interactive do not sponsor this giveaway and are not involved in it in any way.\n\n2. No purchase necessary. Taking part is free, and buying anything in the app does not improve your chances.\n\n3. Who can take part: users aged 18 or older, except in countries and regions where such giveaways are prohibited or restricted by law.\n\n4. How to get a ticket: collect all 50 Discovery Cards and forge them into a ticket — one copy of each card is spent. Each ticket requires at least {ads} spins for watching ads since your previous ticket, and you can forge at most one ticket every {days} days. Every ticket is one entry: more tickets, more chances.\n\n5. Main prize: one Steam key for Grand Theft Auto VI for PC, sent once the PC version is available on Steam. If the game is not released on Steam within 6 months of the draw, the winner receives a digital gift card of equal value instead.\n\n6. Draw: held automatically as soon as {goal} tickets have been forged, and no later than {date}. The server picks the winning ticket at random. The winner’s nickname (or “Player” if the profile is hidden) and the ticket number are shown in the app.\n\n7. Monthly prize: on the 1st of every month one ticket that hasn’t won a monthly prize yet is drawn. Its owner gets lifetime No Ads and the exclusive Platinum theme. The ticket stays in the main draw.\n\n8. Claiming the main prize: the winner sees a personal claim code on the giveaway screen and must send it to {email} within 30 days. We will never ask for passwords or payment details.\n\n9. Tickets belong to your account. If you restore your progress with a recovery code, your tickets move to the new install within 2 days. Tickets obtained by cheating or abusing the app are void.\n\n10. We may change or cancel the giveaway only for reasons beyond our control; tickets already forged will then be taken into account fairly."},"ru":{"title":"ПРАВИЛА РОЗЫГРЫША","giveaway":"РОЗЫГРЫШ GTA VI","prize":"Приз: GTA VI для ПК (ключ Steam)","body":"1. Организатор: Sokyra Labs, разработчик Vice Atlas. Google, Rockstar Games и Take-Two Interactive не являются спонсорами розыгрыша и никак в нём не участвуют.\n\n2. Покупка не требуется. Участие бесплатное, и никакие покупки в приложении не повышают шансы.\n\n3. Кто может участвовать: пользователи от 18 лет, кроме стран и регионов, где такие розыгрыши запрещены или ограничены законом.\n\n4. Как получить билет: соберите все 50 карточек открытий и перекуйте их в билет — тратится по одному экземпляру каждой карточки. Для каждого билета нужно не меньше {ads} прокрутов за просмотр рекламы с момента предыдущего билета, и получать билет можно не чаще раза в {days} дней. Каждый билет — один шанс: больше билетов, больше шансов.\n\n5. Главный приз: один ключ Steam на Grand Theft Auto VI для ПК. Ключ отправляется, когда версия для ПК появится в Steam. Если игра не выйдет в Steam в течение 6 месяцев после розыгрыша, победитель вместо ключа получает цифровую подарочную карту той же стоимости.\n\n6. Розыгрыш проходит автоматически, как только будет перековано {goal} билетов, но не позже {date}. Сервер выбирает выигрышный билет случайным образом. Ник победителя (или «Игрок», если профиль скрыт) и номер билета публикуются в приложении.\n\n7. Приз месяца: 1-го числа каждого месяца разыгрывается один билет среди тех, что ещё не выигрывали приз месяца. Его владелец получает «Без рекламы» навсегда и эксклюзивную тему Platinum. Билет продолжает участвовать в главном розыгрыше.\n\n8. Получение главного приза: победитель видит на экране розыгрыша личный код и должен отправить его на {email} в течение 30 дней. Мы никогда не просим пароли или платёжные данные.\n\n9. Билеты привязаны к вашему аккаунту. Если вы восстановите прогресс по коду восстановления, билеты перенесутся на новое устройство в течение 2 дней. Билеты, полученные с помощью обмана или злоупотребления приложением, аннулируются.\n\n10. Мы можем изменить или отменить розыгрыш только по причинам, от нас не зависящим; уже перекованные билеты при этом будут честно учтены."},"uk":{"title":"ПРАВИЛА РОЗІГРАШУ","giveaway":"РОЗІГРАШ GTA VI","prize":"Приз: GTA VI для ПК (ключ Steam)","body":"1. Організатор: Sokyra Labs, розробник Vice Atlas. Google, Rockstar Games і Take-Two Interactive не є спонсорами розіграшу й жодним чином у ньому не беруть участі.\n\n2. Купівля не потрібна. Участь безкоштовна, і жодні покупки в застосунку не підвищують шанси.\n\n3. Хто може брати участь: користувачі від 18 років, крім країн і регіонів, де такі розіграші заборонені або обмежені законом.\n\n4. Як отримати квиток: зберіть усі 50 карток відкриттів і перекуйте їх у квиток — витрачається по одному примірнику кожної картки. Для кожного квитка потрібно щонайменше {ads} обертів за перегляд реклами з моменту попереднього квитка, і отримувати квиток можна не частіше ніж раз на {days} днів. Кожен квиток — один шанс: більше квитків, більше шансів.\n\n5. Головний приз: один ключ Steam на Grand Theft Auto VI для ПК. Ключ надсилається, коли версія для ПК з’явиться в Steam. Якщо гра не вийде в Steam протягом 6 місяців після розіграшу, переможець замість ключа отримує цифрову подарункову картку тієї ж вартості.\n\n6. Розіграш відбувається автоматично, щойно буде перековано {goal} квитків, але не пізніше {date}. Сервер обирає виграшний квиток випадково. Нік переможця (або «Гравець», якщо профіль приховано) і номер квитка публікуються в застосунку.\n\n7. Приз місяця: 1-го числа кожного місяця розігрується один квиток серед тих, що ще не вигравали приз місяця. Його власник отримує «Без реклами» назавжди та ексклюзивну тему Platinum. Квиток і далі бере участь у головному розіграші.\n\n8. Отримання головного призу: переможець бачить на екрані розіграшу особистий код і має надіслати його на {email} протягом 30 днів. Ми ніколи не просимо паролі чи платіжні дані.\n\n9. Квитки прив’язані до вашого акаунта. Якщо ви відновите прогрес за кодом відновлення, квитки перенесуться на новий пристрій протягом 2 днів. Квитки, отримані шахрайством або зловживанням застосунком, анулюються.\n\n10. Ми можемо змінити або скасувати розіграш лише з причин, що від нас не залежать; уже перековані квитки при цьому буде чесно враховано."},"ar":{"title":"قواعد السحب","giveaway":"سحب GTA VI","prize":"الجائزة: GTA VI للكمبيوتر (مفتاح Steam)","body":"1. الجهة المنظِّمة: Sokyra Labs، مطوّر Vice Atlas. شركات Google وRockstar Games وTake-Two Interactive ليست راعية لهذا السحب ولا علاقة لها به بأي شكل.\n\n2. لا يلزم أي شراء. المشاركة مجانية، ولا يزيد أي شراء داخل التطبيق من فرصك.\n\n3. من يمكنه المشاركة: المستخدمون الذين تبلغ أعمارهم 18 عامًا أو أكثر، باستثناء الدول والمناطق التي يحظر فيها القانون هذا النوع من السحوبات أو يقيّده.\n\n4. كيف تحصل على تذكرة: اجمع بطاقات الاكتشاف الخمسين كلها وحوّلها إلى تذكرة، وتُستهلك نسخة واحدة من كل بطاقة. تتطلب كل تذكرة {ads} دورة على الأقل مقابل مشاهدة الإعلانات منذ التذكرة السابقة، ولا يمكنك صنع أكثر من تذكرة واحدة كل {days} يومًا. كل تذكرة فرصة واحدة: تذاكر أكثر، فرص أكثر.\n\n5. الجائزة الكبرى: مفتاح Steam واحد للعبة Grand Theft Auto VI على الكمبيوتر، يُرسل بمجرد توفر نسخة الكمبيوتر على Steam. وإذا لم تصدر اللعبة على Steam خلال 6 أشهر من السحب، يحصل الفائز بدلًا من ذلك على بطاقة هدايا رقمية بالقيمة نفسها.\n\n6. السحب: يُجرى تلقائيًا فور صنع {goal} تذكرة، وفي موعد أقصاه {date}. يختار الخادم التذكرة الفائزة عشوائيًا. ويُعرض في التطبيق اسم الفائز المستعار (أو «لاعب» إذا كان الملف الشخصي مخفيًا) ورقم التذكرة.\n\n7. جائزة الشهر: في اليوم الأول من كل شهر تُسحب تذكرة واحدة من بين التذاكر التي لم تفز بجائزة الشهر بعد. ويحصل صاحبها على إزالة الإعلانات مدى الحياة وسمة Platinum الحصرية. وتبقى التذكرة مشاركة في السحب الرئيسي.\n\n8. استلام الجائزة الكبرى: يرى الفائز رمزًا شخصيًا في شاشة السحب، وعليه إرساله إلى {email} خلال 30 يومًا. لن نطلب منك أبدًا كلمات مرور أو بيانات دفع.\n\n9. التذاكر مرتبطة بحسابك. إذا استعدت تقدمك باستخدام رمز الاسترداد، فستُنقل تذاكرك إلى التثبيت الجديد خلال يومين. التذاكر التي يُحصل عليها بالغش أو بإساءة استخدام التطبيق تُلغى.\n\n10. لا يجوز لنا تعديل السحب أو إلغاؤه إلا لأسباب خارجة عن إرادتنا، وفي هذه الحالة تُحتسب التذاكر المصنوعة بشكل عادل."},"da":{"title":"BETINGELSER","giveaway":"GTA VI-LODTRÆKNING","prize":"Præmie: GTA VI til pc (Steam-nøgle)","body":"1. Arrangør: Sokyra Labs, udvikleren af Vice Atlas. Google, Rockstar Games og Take-Two Interactive sponsorerer ikke lodtrækningen og er ikke involveret i den på nogen måde.\n\n2. Køb er ikke nødvendigt. Det er gratis at deltage, og ingen køb i appen øger dine chancer.\n\n3. Hvem kan deltage: brugere på 18 år eller derover, undtagen i lande og regioner, hvor sådanne lodtrækninger er forbudt eller begrænset ved lov.\n\n4. Sådan får du et lod: saml alle 50 opdagelseskort, og smed dem til et lod – ét eksemplar af hvert kort bruges. Hvert lod kræver mindst {ads} spins ved at se reklamer siden det forrige lod, og du kan højst smede ét lod hver {days}. dag. Hvert lod er én deltagelse: flere lodder, flere chancer.\n\n5. Hovedpræmie: én Steam-nøgle til Grand Theft Auto VI til pc, som sendes, når pc-versionen er tilgængelig på Steam. Hvis spillet ikke udkommer på Steam inden for 6 måneder efter lodtrækningen, får vinderen i stedet et digitalt gavekort af samme værdi.\n\n6. Lodtrækning: sker automatisk, så snart der er smedet {goal} lodder, senest {date}. Serveren vælger vinderloddet tilfældigt. Vinderens kaldenavn (eller »Spiller«, hvis profilen er skjult) og lodnummeret vises i appen.\n\n7. Månedens præmie: den 1. i hver måned trækkes ét lod blandt dem, der endnu ikke har vundet en månedspræmie. Ejeren får Reklamefri for altid og det eksklusive tema Platinum. Loddet er stadig med i hovedlodtrækningen.\n\n8. Indløsning af hovedpræmien: vinderen ser en personlig kode på lodtrækningsskærmen og skal sende den til {email} inden for 30 dage. Vi beder aldrig om adgangskoder eller  binnen 6 maanden na de trekking op Steam, dan krijgt de winnaar in plaats daarvan een digitale cadeaukaart van dezelfde waarde.\n\n6. Trekking: deze vindt automatisch plaats zodra er {goal} loten zijn gesmeed, uiterlijk op {date}. De server kiest het winnende lot willekeurig. De bijnaam van de winnaar (of ‘Speler’ als het profiel verborgen is) en het lotnummer worden in de app getoond.\n\n7. Prijs van de maand: op de 1e van elke maand wordt één lot getrokken uit de loten die nog geen maandprijs hebben gewonnen. De eigenaar krijgt levenslang Geen advertenties en het exclusieve Platinum-thema. Het lot blijft meedoen aan de hoofdtrekking.\n\n8. De hoofdprijs claimen: de winnaar ziet op het winactiescherm een persoonlijke code en moet die binnen 30 dagen naar {email} sturen. We vragen nooit om wachtwoorden of betaalgegevens.\n\n9. Loten horen bij je account. Als je je voortgang herstelt met een herstelcode, worden je loten binnen 2 dagen naar de nieuwe installatie overgezet. Loten verkregen door valsspelen of misbruik van de app zijn ongeldig.\n\n10. We kunnen de winactie alleen wijzigen of annuleren om redenen buiten onze macht; al gesmede loten worden dan eerlijk meegeteld."},"pl":{"title":"REGULAMIN LOSOWANIA","giveaway":"LOSOWANIE GTA VI","prize":"Nagroda: GTA VI na PC (klucz Steam)","body":"1. Organizator: Sokyra Labs, twórca Vice Atlas. Google, Rockstar Games i Take-Two Interactive nie są sponsorami losowania i w żaden sposób w nim nie uczestniczą.\n\n2. Zakup nie jest wymagany. Udział jest bezpłatny, a żadne zakupy w aplikacji nie zwiększają szans.\n\n3. Kto może wziąć udział: użytkownicy, którzy ukończyli 18 lat, z wyjątkiem krajów i regionów, w których takie losowania są zakazane lub ograniczone prawem.\n\n4. Jak zdobyć los: zbierz wszystkie 50 kart odkryć i przekuj je w los — zużywany jest jeden egzemplarz każdej karty. Każdy los wymaga co najmniej {ads} losowań za obejrzenie reklamy od poprzedniego losu, a los można przekuć nie częściej niż raz na {days} dni. Każdy los to jedno zgłoszenie: więcej losów, więcej szans.\n\n5. Nagroda główna: jeden klucz Steam do Grand Theft Auto VI na PC, wysyłany, gdy wersja na PC pojawi się na Steamie. Jeśli gra nie ukaże się na Steamie w ciągu 6 miesięcy od losowania, zwycięzca otrzyma zamiast tego cyfrową kartę podarunkową o tej samej wartości.\n\n6. Losowanie odbywa się automatycznie, gdy zostanie przekutych {goal} losów, najpóźniej {date}. Serwer wybiera zwycięski los losowo. Nick zwycięzcy (lub „Gracz”, jeśli profil jest ukryty) i numer losu są pokazywane w aplikacji.\n\n7. Nagroda miesiąca: 1. dnia każdego miesiąca losowany jest jeden los spośród tych, które nie wygrały jeszcze nagrody miesiąca. Jego właściciel otrzymuje dożywotni Brak reklam i ekskluzywny motyw Platinum. Los nadal bierze udział w głównym losowaniu.\n\n8. Odbiór nagrody głównej: zwycięzca widzi na ekranie losowania osobisty kod i musi wysłać go na {email} w ciągu 30 dni. Nigdy nie prosimy o hasła ani dane płatnicze.\n\n9. Losy są przypisane do twojego konta. Jeśli przywrócisz postępy kodem odzyskiwania, losy zostaną przeniesione na nową instalację w ciągu 2 dni. Losy zdobyte oszustwem lub nadużyciem aplikacji są nieważne.\n\n10. Możemy zmienić lub odwołać losowanie wyłącznie z przyczyn od nas niezależnych; przekute już losy zostaną wtedy uczciwie uwzględnione."},"pt":{"title":"REGULAMENTO DO SORTEIO","giveaway":"SORTEIO DE GTA VI","prize":"Prêmio: GTA VI para PC (chave Steam)","body":"1. Organizador: Sokyra Labs, desenvolvedor do Vice Atlas. Google, Rockstar Games e Take-Two Interactive não patrocinam este sorteio e não participam dele de forma alguma.\n\n2. Nenhuma compra é necessária. A participação é gratuita, e nenhuma compra no app aumenta suas chances.\n\n3. Quem pode participar: usuários com 18 anos ou mais, exceto em países e regiões onde esse tipo de sorteio seja proibido ou restrito por lei.\n\n4. Como conseguir um bilhete: reúna as 50 cartas de descoberta e forje-as em um bilhete; uma cópia de cada carta é gasta. Cada bilhete exige pelo menos {ads} giros por assistir a anúncios desde o bilhete anterior, e é possível forjar no máximo um bilhete a cada {days} dias. Cada bilhete é uma participação: mais bilhetes, mais chances.\n\n5. Prêmio principal: uma chave Steam de Grand Theft Auto VI para PC, enviada quando a versão para PC estiver disponível na Steam. Se o jogo não for lançado na Steam em até 6 meses após o sorteio, o vencedor recebe no lugar um cartão-presente digital de mesmo valor.\n\n6. Sorteio: realizado automaticamente assim que {goal} bilhetes forem forjados, e no máximo até {date}. O servidor escolhe o bilhete vencedor aleatoriamente. O apelido do vencedor (ou «Jogador», se o perfil estiver oculto) e o número do bilhete são exibidos no app.\n\n7. Prêmio do mês: no dia 1º de cada mês é sorteado um bilhete entre os que ainda não ganharam um prêmio do mês. O dono recebe Sem anúncios para sempre e o tema exclusivo Platinum. O bilhete continua no sorteio principal.\n\n8. Resgate do prêmio principal: o vencedor verá um código pessoal na tela do sorteio e deverá enviá-lo para {email} em até 30 dias. Nunca pediremos senhas ou dados de pagamento.\n\n9. Os bilhetes pertencem à sua conta. Se você restaurar seu progresso com um código de recuperação, seus bilhetes serão transferidos para a nova instalação em até 2 dias. Bilhetes obtidos por trapaça ou abuso do app são anulados.\n\n10. Só podemos alterar ou cancelar o sorteio por motivos alheios à nossa vontade; nesse caso, os bilhetes já forjados serão considerados de forma justa."},"sv":{"title":"VILLKOR","giveaway":"GTA VI-UTLOTTNING","prize":"Pris: GTA VI till pc (Steam-nyckel)","body":"1. Arrangör: Sokyra Labs, utvecklare av Vice Atlas. Google, Rockstar Games och Take-Two Interactive sponsrar inte utlottningen och är inte inblandade i den på något sätt.\n\n2. Inget köp krävs. Det är gratis att delta, och inga köp i appen ökar dina chanser.\n\n3. Vem får delta: användare som är 18 år eller äldre, utom i länder och regioner där sådana utlottningar är förbjudna eller begränsade enligt lag.\n\n4. Så får du en lott: samla alla 50 upptäcktskort och smid dem till en lott – ett exemplar av varje kort förbrukas. Varje lott kräver minst {ads} snurr genom att titta på reklam sedan föregående lott, och du kan smida högst en lott var {days}:e dag. Varje lott är en chans: fler lotter, fler chanser.\n\n5. Huvudpris: en Steam-nyckel till Grand Theft Auto VI för pc, som skickas när pc-versionen finns på Steam. Om spelet inte släpps på Steam inom 6 månader efter dragningen får vinnaren i stället ett digitalt presentkort till samma värde.\n\n6. Dragning: sker automatiskt så snart {goal} lotter har smitts, senast {date}. Servern väljer vinnande lott slumpmässigt. Vinnarens smeknamn (eller ”Spelare” om profilen är dold) och lottnumret visas i appen.\n\n7. Månadens pris: den 1:a varje månad dras en lott bland dem som ännu inte vunnit ett månadspris. Ägaren får Reklamfritt för alltid och det exklusiva temat Platinum. Lotten är fortfarande med i huvuddragningen.\n\n8. Hämta ut huvudpriset: vinnaren ser en personlig kod på utlottningsskärmen och ska skicka den till {email} inom 30 dagar. Vi ber aldrig om lösenord eller betaluppgifter.\n\n9. Lotterna tillhör ditt konto. Om du återställer dina framsteg med en återställningskod flyttas lotterna till den nya installationen inom 2 dagar. Lotter som skaffats genom fusk eller missbruk av appen är ogiltiga.\n\n10. Vi kan bara ändra eller avbryta utlottningen av skäl utanför vår kontroll; redan smidda lotter räknas då med på ett rättvist sätt."},"tr":{"title":"ÇEKİLİŞ KURALLARI","giveaway":"GTA VI ÇEKİLİŞİ","prize":"Ödül: PC için GTA VI (Steam anahtarı)","body":"1. Düzenleyen: Vice Atlas’ın geliştiricisi Sokyra Labs. Google, Rockstar Games ve Take-Two Interactive bu çekilişin sponsoru değildir ve çekilişle hiçbir şekilde ilgileri yoktur.\n\n2. Satın alma gerekmez. Katılım ücretsizdir ve uygulama içi hiçbir satın alma şansını artırmaz.\n\n3. Kimler katılabilir: 18 yaşında veya daha büyük kullanıcılar; bu tür çekilişlerin yasayla yasaklandığı ya da kısıtlandığı ülke ve bölgeler hariç.\n\n4. Bilet nasıl alınır: 50 Keşif Kartının hepsini topla ve bilete dönüştür; her karttan bir kopya harcanır. Her bilet için önceki biletten bu yana reklam izleyerek en az {ads} çevirme gerekir ve en fazla {days} günde bir bilet dövülebilir. Her bilet bir katılım hakkıdır: daha çok bilet, daha çok şans.\n\n5. Büyük ödül: PC için bir adet Grand Theft Auto VI Steam anahtarı; PC sürümü Steam’de çıktığında gönderilir. Oyun çekilişten sonraki 6 ay içinde Steam’de çıkmazsa kazanana bunun yerine aynı değerde dijital hediye kartı verilir.\n\n6. Çekiliş: {goal} bilet dövüldüğü anda, en geç {date} tarihinde otomatik olarak yapılır. Kazanan bileti sunucu rastgele seçer. Kazananın takma adı (profil gizliyse «Oyuncu») ve bilet numarası uygulamada gösterilir.\n\n7. Ayın ödülü: her ayın 1’inde, henüz ayın ödülünü kazanmamış biletler arasından bir bilet çekilir. Sahibi ömür boyu Reklamsız ve özel Platinum temasını kazanır. Bilet ana çekilişte kalmaya devam eder.\n\n8. Büyük ödülü alma: kazanan, çekiliş ekranında kişisel bir kod görür ve bu kodu 30 gün içinde {email} adresine göndermelidir. Senden asla şifre veya ödeme bilgisi istemeyiz.\n\n9. Biletler hesabına aittir. İlerlemeni kurtarma koduyla geri yüklersen biletlerin 2 gün içinde yeni kuruluma taşınır. Hile veya uygulamayı kötüye kullanarak elde edilen biletler geçersizdir.\n\n10. Çekilişi yalnızca kontrolümüz dışındaki nedenlerle değiştirebilir veya iptal edebiliriz; bu durumda dövülmüş biletler adil şekilde dikkate alınır."},"zh":{"title":"抽奖规则","giveaway":"GTA VI 抽奖","prize":"奖品：PC版GTA VI（Steam激活码）","body":"1. 主办方：Vice Atlas的开发者Sokyra Labs。Google、Rockstar Games和Take-Two Interactive不是本次抽奖的赞助方，也未以任何方式参与其中。\n\n2. 无需购买。参与免费，应用内的任何购买都不会提高中奖几率。\n\n3. 参与资格：年满18岁的用户，但法律禁止或限制此类抽奖的国家和地区除外。\n\n4. 如何获得抽奖券：集齐全部50张发现卡片并锻造成抽奖券，每张卡片消耗一份。每张抽奖券要求自上一张抽奖券以来至少通过观看广告旋转{ads}次，且每{days}天最多锻造一张。每张抽奖券代表一次参与机会：抽奖券越多，机会越多。\n\n5. 大奖：一个PC版Grand Theft Auto VI的Steam激活码，在PC版登陆Steam后发放。若游戏在开奖后6个月内未在Steam发售，中奖者将改为获得等值的数字礼品卡。\n\n6. 开奖：锻造的抽奖券达到{goal}张时自动开奖，最迟于{date}开奖。中奖抽奖券由服务器随机抽取。中奖者的昵称（若资料已隐藏则显示为“玩家”）和抽奖券编号将在应用中公布。\n\n7. 月度奖品：每月1日，从尚未赢得月度奖品的抽奖券中抽出一张。券主将获得永久免广告和专属Platinum主题。该抽奖券仍参加主抽奖。\n\n8. 领取大奖：中奖者会在抽奖页面看到个人代码，须在30天内将其发送至{email}。我们绝不会索要密码或支付信息。\n\n9. 抽奖券归属于你的账号。如果你用恢复码恢复进度，抽奖券会在2天内转移到新安装的应用中。通过作弊或滥用应用获得的抽奖券无效。\n\n10. 仅在出现我们无法控制的原因时，我们才可能更改或取消抽奖;届时已锻造的抽奖券将被公平对待。"}};
